name: ci

on:
  pull_request:
    branches:
      - release
      - main
  push:
    branches:
      - develop
      - release
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      # Los typechecks no los cubría el build: `next build` y `medusa build`
      # transpilan sin validar tipos en todo el árbol.
      - name: Typecheck
        run: npm run typecheck

      - name: Test tools
        run: npm run tools:test

      # Aquí viven, entre otros, los tests que impiden clasificar como
      # "reintentable" un fallo que no lo es. Sin este paso no protegían nada.
      - name: Test backend
        run: npm run backend:test:unit

      - name: Validate compose
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          JWT_SECRET: ci-jwt-secret
          COOKIE_SECRET: ci-cookie-secret
          TOOLS_API_TOKEN: ci-tools-token
        run: docker compose config >/tmp/ecommerce-compose.yml
